name: Live Status

on:
  schedule:
    # Mỗi 3 tiếng — thời tiết, GitHub stats, Hacker News, quote
    - cron: "15 */3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/live-status.py
      - scripts/gen-readme-3d.py

permissions:
  contents: write

concurrency:
  group: live-status
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render live status SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/live-status.py assets/readme ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/live-3d.svg assets/readme/live-data.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(live): update live status [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
